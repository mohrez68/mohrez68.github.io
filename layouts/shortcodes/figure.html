{{- $src := .Get "src" -}}
{{- with .Page.Resources.GetMatch $src }}{{ $src = .RelPermalink }}{{ end -}}
<figure{{ with .Get "class" }} class="{{ . }}"{{ end }}>
  {{- if .Get "link" -}}
    <a href="{{ .Get "link" }}"{{ with .Get "target" }} target="{{ . }}"{{ end }}{{ with .Get "rel" }} rel="{{ . }}"{{ end }}>
  {{- end -}}
  <img src="{{ $src | safeURL }}"{{ with .Get "alt" }} alt="{{ . }}"{{ end }}{{ with .Get "title" }} title="{{ . }}"{{ end }}{{ with .Get "width" }} width="{{ . }}"{{ end }}{{ with .Get "height" }} height="{{ . }}"{{ end }}{{ with .Get "loading" }} loading="{{ . }}"{{ end }}>
  {{- if .Get "link" }}</a>{{ end -}}
  {{- with .Get "caption" -}}
    <figcaption>{{ . | markdownify }}</figcaption>
  {{- end -}}
</figure>
